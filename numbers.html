  <section>
    <h2>Assignment 3: First N Natural Numbers</h2>
    <p>Factorial (while loop), sum (do-while loop), average (for loop).</p>
    <label for="n-in">N (a whole number, 1 or more)</label>
    <input type="number" id="n-in" placeholder="e.g. 5">
    <button id="n-go">Compute</button>
    <p id="n-out"></p>
  </section>


  <script>


    document.getElementById("n-go").addEventListener("click", () => {
      const n = parseInt(document.getElementById("n-in").value, 10);
      const out = document.getElementById("n-out");

      if (isNaN(n) || n < 1) {
        out.textContent = "Please enter a whole number of 1 or more.";
        return;
      }

      // 1. Factorial with a WHILE loop
      let fact = 1;
      let i = 1;
      while (i <= n) {
        fact *= i;
        i++;
      }

      // 2. Sum with a DO-WHILE loop
      let sum = 0;
      let j = 1;
      do {
        sum += j;
        j++;
      } while (j <= n);

      // 3. Average with a FOR loop
      let total = 0;
      for (let k = 1; k <= n; k++) {
        total += k;
      }
      const avg = total / n;

      out.innerHTML = `${n}! = ${fact}<br>Sum = ${sum}<br>Average = ${avg}`;
    });


  </script>


</body>


</html>
